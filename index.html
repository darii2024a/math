html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15.5px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--card);padding:8px 14px;border-radius:6px;cursor:pointer}
button:hover{border-color:var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:var(--on)}
button.d{color:var(--bad)}
button.l{border:0;background:none;color:var(--mu);text-decoration:underline;padding:4px 0}
button:disabled{opacity:.5}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--card)}
input[type=checkbox]{width:auto}
label{display:block;margin:12px 0 4px;font-size:13px;color:var(--mu)}
a{color:var(--ac)}
h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.pt{font-size:26px;margin:4px 0 14px}
.h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);margin:0 0 8px}
.mu{color:var(--mu);font-size:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.hide{display:none!important}
.err{color:var(--bad);font-size:14px;min-height:20px;margin:6px 0}
.tag{font-size:12px;color:var(--mu);border:1px solid var(--bd);padding:1px 6px;border-radius:4px;margin-left:8px;font-weight:400}

#auth{max-width:440px;margin:0 auto;padding:20px 16px}
.seg{display:flex;margin:12px 0;border:1px solid var(--bd);border-radius:6px;overflow:hidden}

.lang{display:flex;gap:14px;justify-content:flex-end;margin-bottom:8px}.lang button{border:0;background:none;padding:2px;color:var(--mu)}.lang button.on{color:var(--ac);font-weight:600;border-bottom:2px solid var(--ac);border-radius:0}
.sb{position:fixed;top:0;bottom:0;left:0;width:240px;background:var(--card);border-right:1px solid var(--bd);padding:calc(16px + env(safe-area-inset-top,0px)) 0 14px;transform:translateX(-100%);transition:transform .2s;z-index:20;overflow-y:auto}

.sb .nv.on{border-left-color:var(--ac);color:var(--ac);font-weight:600;background:var(--ac2)}
.ov{position:fixed;inset:0;background:#0006;z-index:10}
.top{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card)}
main{padding:18px 14px;max-width:860px;margin:0 auto}

.opt{display:block;width:100%;text-align:left;margin:6px 0}

.cd{min-height:46px;padding:4px 2px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:inherit;cursor:pointer}

details>summary{flex-wrap:wrap}

</style>

/* Math platform: параметрлі есептер банкі (ЖИ-сіз, лимитсіз).
   Әр есеп кездейсоқ сандармен құралады, жауабы кодпен есептеледі.
   Қате жауаптар типтік қателерден жасалған: ar (арифметика), sign (таңба), form (формула), trans (түрлендіру). */
(function(){
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[ri(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const num=n=>String(Math.round(n*1e6)/1e6).replace('.',',');
const f=v=>typeof v==='number'?num(v):String(v);
const fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;n/=g;d/=g;return d===1?String(n):n+'/'+d};
const sg=n=>n<0?'- '+(-n):'+ '+n;
const mn=n=>n<0?'−'+(-n):String(n);

const fact=n=>n<2?1:n*fact(n-1);
const nz=(a,b)=>{let x=0;while(!x)x=ri(a,b);return x};
const TR=[[3,4,5],[5,12,13],[6,8,10],[8,15,17],[9,12,15]];

function mk(t,kk,ru,a,w){
  a=f(a);const seen=new Set([a]),d=[];
  for(const [v,e] of w){const s=f(v);if(!seen.has(s)){seen.add(s);d.push({v:s,e})}}
  const n0=parseFloat(a.replace(',','.'));let k=1;
  const cm=a.match(/^\((-?\d+); (-?\d+)\)$/),fm=a.match(/^(-?\d+)\/(\d+)$/);
  while(d.length<3&&k<30){let s=null;
    if(cm){s=k%2?pt(+cm[1]+Math.ceil(k/2),cm[2]):pt(cm[1],+cm[2]+Math.ceil(k/2))}
    else if(fm){s=k%2?fr(+fm[1]+Math.ceil(k/2),+fm[2]):fr(+fm[1],+fm[2]+Math.ceil(k/2))}
    else if(!isNaN(n0)&&/^-?[\d,]+$/.test(a))s=num(n0+(k%2?1:-1)*Math.ceil(k/2));
    if(s&&!seen.has(s)){seen.add(s);d.push({v:s,e:'ar'})}k++}
  const o=sh([{v:a,c:1},...d.slice(0,3)]);
  return {t,q:{kk,ru},o:o.map(x=>({v:x.v,e:x.c?null:x.e})),a:o.findIndex(x=>x.c)};
}

const G={
bol:[
{g:5,f(){const g=pk([2,3,4,5,6]),p=pk([2,3,5,7]);let q=pk([2,3,4,5,7]);while(q===p||gcd(p,q)!==1)q=pk([2,3,4,5,7]);const a=g*p,b=g*q;
 return ri(0,1)?mk('bol',`${a} және ${b} сандарының ЕҮОБ-ын тап.`,`Найди НОД чисел ${a} и ${b}.`,g,[[g*p*q,'form'],[a-b>0?a-b:b-a,'form'],[p*q,'form']])
  :mk('bol',`${a} және ${b} сандарының ЕКОЕ-н тап.`,`Найди НОК чисел ${a} и ${b}.`,g*p*q,[[g,'form'],[a*b,'form'],[a+b,'form']])}},
{g:5,f(){const d=ri(5,12),a=ri(1,d-2),b=ri(1,d-2),sm=a+b;

<script data-plan>
/* Күнделікті жоспар қозғалтқышы: таза функция, сайттың күйіне тәуелді емес (Node-та тексеруге болады).
   Кіріс: start (YYYY-MM-DD), H (күн саны), ch (тарау тізімі: k, need 1..4, why, sc, dom),
          all (қайталау реті), n (жаттығу көлемі), tn (тест көлемі).
   Шығыс: days:[{date,items:[{id,t,ch,n,...}]}], trimmed (сыймай қалған тарау саны). */
(function(){
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addD=(s,n)=>{const p=s.split('-').map(Number);return iso(new Date(p[0],p[1]-1,p[2]+n))};
/* need: 1 негізді тексеру, 2 жақсартуға жақын, 3 олқылық, 4 үлкен олқылық */
const STEPS={1:['practice','test'],2:['practice','fix','test'],3:['theory','practice','fix','test'],4:['theory','practice','fix','practice2','test']};
const mkItem=(s,c,o)=>{const b={ch:c.k,w:c.why,sc:c.sc};
  if(s==='theory')return{...b,id:'theory-'+c.k,t:'theory'};
  if(s==='practice')return{...b,id:'practice-'+c.k,t:'practice',n:o.n,e:c.dom||null};
  if(s==='practice2')return{...b,id:'practice2-'+c.k,t:'practice',x:1,n:o.n,e:c.dom||null};
  if(s==='fix')return{...b,id:'fix-'+c.k,t:'fix',n:Math.ceil(o.n/2),e:c.dom||null};
  return{...b,id:'test-'+c.k,t:'test',n:o.tn}};
const tasksOf=its=>its.reduce((a,i)=>a+(i.t==='retest'?10:(i.n||0)),0);

function build(o){
  const H=o.H,days=[];
  for(let i=0;i<H;i++)days.push({date:addD(o.start,i),items:[]});
  const out={days,trimmed:0,ends:[]};
  if(H<=0)return out;
  const fin=H>=5?1:0,avail=H-fin;           // соңғы күн: деңгейлік тестті қайта тапсыру
  let list=(o.ch||[]).slice();
  if(list.length>avail){                     // мерзім қысқа: ең қажеттілерін қалдырамыз
    const keep=list.map((c,i)=>i).sort((a,b)=>list[b].need-list[a].need||a-b).slice(0,Math.max(avail,0)).sort((a,b)=>a-b);
    out.trimmed=list.length-keep.length;list=keep.map(i=>list[i]);
  }
  const full=list.map(c=>STEPS[c.need]||STEPS[2]),tot=full.reduce((a,s)=>a+s.length,0);
  let rooms=full.map(s=>s.length);
  if(tot>avail){                             // күн аз: қадамдарды күндерге тығыздаймыз
    rooms=full.map(s=>Math.max(1,Math.floor(s.length*avail/tot)));
    let used=rooms.reduce((a,b)=>a+b,0);
    const ord=list.map((c,i)=>i).sort((a,b)=>list[b].need-list[a].need||a-b);
    for(let j=0;used<avail&&j<ord.length*5;j++){const i=ord[j%ord.length];if(rooms[i]<full[i].length){rooms[i]++;used++}}
    while(used>avail){let k=-1;rooms.forEach((r,i)=>{if(r>1&&(k<0||r>rooms[k]))k=i});if(k<0)break;rooms[k]--;used--}
  }
  let cur=0;
  list.forEach((c,i)=>{
    const st=full[i],room=rooms[i];
    for(let j=0;j<room;j++){
      const a=Math.floor(j*st.length/room),b=Math.floor((j+1)*st.length/room);
      st.slice(a,b).forEach(s=>days[cur+j].items.push(mkItem(s,c,o)));
    }
    out.ends.push({ch:c.k,end:cur+room-1});cur+=room;
  });
  const all=o.all&&o.all.length?o.all:list.map(c=>c.k);
  if(all.length)for(let d=cur,j=0;d<avail;d++,j++){const ch=all[j%all.length];days[d].items.push({id:'review-'+ch,t:'review',ch,n:o.n,w:'R'})}
  out.ends.forEach(e=>[2,6].forEach(off=>{            // аралықты қайталау: блоктан 2 және 6 күн кейін
    const d=e.end+off;
    if(d<avail&&days[d]&&days[d].items.length<3&&!days[d].items.some(x=>x.ch===e.ch))days[d].items.push({id:'review-'+e.ch,t:'review',ch:e.ch,n:5,w:'R'});
  }));
  if(H>=7)for(let i=6;i<H;i+=7)days[i].items.push({id:'reflect',t:'reflect'});
  if(fin)days[H-1].items.push({id:'retest',t:'retest'});
  return out;
}
const api={build,addD,iso,tasksOf,len:need=>(STEPS[need]||STEPS[2]).length};
(typeof window!=='undefined'?window:globalThis).PLAN=api;
if(typeof module!=='undefined')module.exports=api;
})();

function renderQuiz(){
  const box=$('#qBox');box.replaceChildren();

    x.o.forEach((o,j)=>{const b=E('button','opt',o.v);b.onclick=()=>{quiz.ans[i]=j;[...c.querySelectorAll('.opt')].forEach((y,k)=>y.classList.toggle('sel',k===j))};c.append(b)});box.append(c)});

}
function finish(){
  const ans=quiz.ans.filter(a=>a!=null).length;
  if(ans<quiz.qs.length&&!confirm(t('unans')))return;
  let sc=0;const w=new Set(),bad=[],errs={},ce={},wrongNo=[],box=$('#qBox');box.replaceChildren();
  quiz.qs.forEach((x,i)=>{
    const c0=quiz.ans[i],ok=c0===x.a,skip=c0==null,er=(!ok&&!skip)?x.o[c0].e:null;
    if(ok)sc++;
    else{
      w.add(x.t);wrongNo.push(i+1);
      if(er){errs[er]=(errs[er]||0)+1;const q=(ce[x.t]=ce[x.t]||{});q[er]=(q[er]||0)+1}
      bad.push(`«${x.q[L]}»: ${skip?'-':x.o[c0].v} / ${x.o[x.a].v} (${cn(x.t)}${er?', '+ET[L][er]:''})`);
    }
    const c=E('div','c '+(ok?'rok':'rbad'));c.id='rq'+i;
    c.append(E('p','q',(i+1)+'. '+x.q[L]));
    x.o.forEach((o,j)=>{
      const right=j===x.a,mine=j===c0,rw=E('div','ro'+(right?' ok':mine?' no':''));
      rw.append(E('span','rm',right?'✓':mine?'✗':''),E('span',0,o.v));
      if(!ok&&mine)rw.append(E('span','rl',t('yours')));
      if(!ok&&right)rw.append(E('span','rl',t('correct')));
      c.append(rw);
    });
    if(!ok){const bn=E('p','bn',(skip?t('noAns'):t('wrongAns')+' '+x.o[c0].v)+' · '+t('right')+x.o[x.a].v+(er?' · '+ET[L][er]:''));bn.append(E('span','tag',cn(x.t)));c.append(bn)}
    box.append(c);
  });
  const n=quiz.qs.length,p=Math.round(sc/n*100);
  let path;
  if(quiz.m==='place'){const set=new Set(w);[...w].forEach(k=>anc(k).forEach(a=>set.add(a)));path=[...set].sort((a,b)=>dep(a)-dep(b))}
  else path=(quiz.m==='chapter'&&p>=80)?[]:[...w];
  const r=E('div','c '+(wrongNo.length?'rbad':'rok'));
  r.append(E('h3',0,t('result')+': '+sc+' / '+n+' ('+p+'%)'));
  if(wrongNo.length){
    const wl=E('p','bn',t('mistakes')+': ');
    wrongNo.forEach(k=>{const b=E('button','chip','№'+k);b.onclick=()=>$('#rq'+(k-1)).scrollIntoView({behavior:'smooth',block:'center'});wl.append(b)});
    r.append(wl);
  }
  if(quiz.m==='place'||quiz.m==='chapter'){
    const pl=quiz.m==='place',st={};
    quiz.qs.forEach((x,i)=>{const key=pl?x.t:x.ti,o=st[key]=st[key]||{n:0,w:0,tp:{}};o.n++;if(quiz.ans[i]!==x.a){o.w++;if(pl)o.tp[x.ti]=1}});
    const rows=Object.entries(st).sort((a,b)=>b[1].w/b[1].n-a[1].w/a[1].n||b[1].w-a[1].w),top=rows[0]&&rows[0][1].w?rows[0][0]:null;
    const lab=k=>pl?cn(k):(topicsOf(quiz.ch,+U.g)[+k]||{kk:'',ru:''})[L];
    r.append(E('div','h',t(pl?'chErrT':'tpErrT')));
    if(top)r.append(E('p',0,t(pl?'mostErr':'mostErrT')+': '+lab(top)+' ('+st[top].w+'/'+st[top].n+')'));
    rows.forEach(([k,o])=>{const rw=E('div','it'),l=E('div');l.append(E('b',0,lab(k)));
      if(pl&&o.w){const names=Object.keys(o.tp).map(i=>(topicsOf(k,+U.g)[+i]||{})[L]).filter(Boolean);if(names.length)l.append(E('div','mu',t('errTp')+': '+names.join('; ')))}
      const bar=E('div','bar'),fi2=E('i');fi2.style.width=Math.round(o.w/o.n*100)+'%';fi2.style.background=o.w?'var(--bad)':'var(--ok)';bar.append(fi2);l.append(bar);rw.append(l,E('span',o.w?'tag':'mu',o.w+' / '+o.n+' '+t('errWord')));r.append(rw)});
  }
  if(!path.length)r.append(E('p',0,t(wrongNo.length?'closedMsg':'noGap')));
  else{r.append(E('p',0,t(quiz.m==='place'?'path':'repeat')));const ol=E('ol');path.forEach(k=>{const li=E('li',0,cn(k));li.append(E('span','tag',t(w.has(k)?'wrongT':'baseT')));ol.append(li)});r.append(ol)}
  const mkRow=()=>{
    const row=E('div','row'),mb=(x,c,f)=>{const b=E('button',c,x);b.onclick=f;return b};
    if(wrongNo.length)row.append(mb(t('toAI'),'p',()=>{go('chat');askAI('cTest')}));
    if(quiz.item)row.append(mb(t('toPlan'),'',()=>go('strat')));
    if(quiz.m==='place'){
      if(path.length){const ad=mb(t('addStrat'),'p',()=>{U.A.weak=path.slice();weak=path.slice();replan();saveU();saveS();go('strat')});row.append(ad)}
      row.append(mb(t('toStrat'),path.length?'':'p',()=>go('strat')));
    }
    else if(!quiz.item)row.append(mb(t('toVideo'),'',()=>go('video')));
    return row;
  };
  r.append(mkRow());box.prepend(r);
  const bt=E('div','c');bt.append(mkRow());box.append(bt);
  if(bad.length){ctx=(L==='kk'?'Оқушы мына есептерде қателесті (жауабы / дұрысы):\n':'Ученик ошибся в задачах (ответ / верно):\n')+bad.join('\n');S.ctx=ctx}
  if(quiz.m!=='daily')weak=path;
  S.res=res().concat([{date:new Date().toLocaleDateString(L==='kk'?'kk-KZ':'ru-RU'),mode:quiz.m,ch:quiz.ch,sc,n,weak:path,wrong:[...w],errs,ce}]).slice(-80);
  if(quiz.m==='place'){U.A={p,d:today(),weak:[]};if(!U.B)U.B={p:Math.min(100,p+15),d:''}}

    let a;if(x.a){a=E('button','p',t('read'));a.onclick=()=>openPdf(x)}else{a=E('a',0,t('open'));a.href=x.u;a.target='_blank';a.rel='noopener'}r.append(d,a);c.append(r);b.append(c)});
}

/* PDF оқу және ЖИ чат */
const ld=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.onload=ok;e.onerror=no;document.head.append(e)});
const PDFV='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf';let pj=null;
function loadPdfJs(){return pj||(pj=(async()=>{if(!window.pdfjsLib){await ld(PDFV+'.min.js');await ld(PDFV+'.worker.min.js')}pdfjsLib.GlobalWorkerOptions.workerSrc=PDFV+'.worker.min.js';return pdfjsLib})().catch(e=>{pj=null;throw e}))}
let pdf=null,pgN=1,pdfKey='';
async function openPdf(x){
  const b=$('#rdB');$('#rd').classList.remove('hide');$('#rdT').textContent=x.t;$('#rdC').textContent=t('close');b.replaceChildren(E('p','mu',t('loading')));pdfKey=x.a;
  try{const r=await sb.storage.from('books').download(x.a);if(r.error)throw r.error;await loadPdfJs();
    pdf=await pdfjsLib.getDocument({data:await r.data.arrayBuffer()}).promise;pgN=Math.min((S.pos||{})[pdfKey]||1,pdf.numPages);await drawPg()}
  catch(e){b.replaceChildren(E('p','err',t('pdfFail')))}
}
async function drawPg(){
  const b=$('#rdB'),pg=await pdf.getPage(pgN),w=Math.min(b.clientWidth-20,900),sc=w/pg.getViewport({scale:1}).width,v=pg.getViewport({scale:sc*(window.devicePixelRatio||1)});
  const cv=E('canvas');cv.width=v.width;cv.height=v.height;cv.style.width=w+'px';
  await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;
  b.replaceChildren(cv);b.scrollTop=0;$('#rdN').textContent=pgN+' / '+pdf.numPages;S.pos=S.pos||{};S.pos[pdfKey]=pgN;saveS();
}
$('#rdP').onclick=()=>{if(pdf&&pgN>1){pgN--;drawPg()}};$('#rdX2').onclick=()=>{if(pdf&&pgN<pdf.numPages){pgN++;drawPg()}};
$('#rdC').onclick=()=>{$('#rd').classList.add('hide');$('#rdB').replaceChildren();pdf=null};

async function callAI(kind,messages,images){
  const ss=(await sb.auth.getSession()).data.session;if(!ss)throw{code:'auth'};
  let r;try{r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+ss.access_token},body:JSON.stringify({kind,lang:L,messages,images})})}catch(e){throw{code:'fail',detail:'network: '+(e&&e.message||e)}}
  if(r.status===429)throw{code:'rate'};
  if(!r.ok){let b='';try{b=(await r.text()).slice(0,160)}catch(e){}throw{code:'fail',detail:r.status+' '+b}}
  return (await r.json()).text;
}
function toJpeg(blob){return new Promise((ok,no)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.82).split(',')[1])};im.onerror=no;im.src=u})}
let att=[];
function attList(){const l=$('#aList');l.replaceChildren();att.forEach((a,i)=>{const s=E('span',0,a.name+' ');s.style.marginRight='12px';const x=E('button','l','x');x.onclick=()=>{att.splice(i,1);attList()};s.append(x);l.append(s)})}
async function pdfImgs(f,max){await loadPdfJs();const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
  for(let i=1;i<=Math.min(max,d.numPages);i++){const pg=await d.getPage(i),v=pg.getViewport({scale:1.4}),cv=E('canvas');cv.width=v.width;cv.height=v.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:v}).promise;out.push(await new Promise(r=>cv.toBlob(r,'image/jpeg',.85)))}return out}
async function addFiles(fl){
  $('#cE').textContent='';
  for(const f of fl){try{
    if(f.type.startsWith('image/'))att.push({name:f.name||'photo',img:f});
    else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){(await pdfImgs(f,3)).forEach((b,i)=>att.push({name:f.name+' #'+(i+1),img:b}))}
    else att.push({name:f.name,txt:(await f.text()).slice(0,6000)});
  }catch(e){$('#cE').textContent=t('attFail')}}
  attList();
}
[['aCam','iCam'],['aGal','iGal'],['aFile','iFile']].forEach(([b,i])=>{$('#'+b).onclick=()=>$('#'+i).click();$('#'+i).onchange=e=>{addFiles([...e.target.files]);e.target.value=''}});
function bubble(c,x){const m=E('div','m '+c,x);$('#log').append(m);$('#log').scrollTop=1e9;return m}
let busy=false;
async function askAI(text){
  if(busy)return;const er=$('#cE');er.textContent='';let full=text,shown=text;
  if(text==='cTest'){shown=t('cTest');full=ctx?ctx+(L==='kk'?'\n\nОсы қателерді талда.':'\n\nРазбери эти ошибки.'):null}
  if(!full){er.textContent=t('needTest');return}
  const ims=att.filter(a=>a.img).map(a=>a.img),tx=att.filter(a=>a.txt).map(a=>a.name+':\n'+a.txt).join('\n\n');
  if(tx)full+='\n\n'+tx;if(ims.length)full+=L==='kk'?'\n\n(Қоса берілген суретте оқушының есебі немесе шешімі бар.)':'\n\n(На приложенном изображении задача или решение ученика.)';
  if(att.length)shown+='  ['+att.map(a=>a.name).join(', ')+']';att=[];attList();
  msgs.push({role:'user',content:full});bubble('u',shown);busy=true;$('#cS').disabled=true;const m=bubble('a','...');
  try{
    const imgs=[];for(const b of ims.slice(0,3))imgs.push({media_type:'image/jpeg',data:await toJpeg(b)});
    const r=await callAI('tutor',msgs.slice(-9),imgs);
    m.textContent=r;msgs.push({role:'assistant',content:r});
  }catch(e){m.remove();msgs.pop();er.textContent=e&&e.code==='rate'?t('rate'):t('fail')+(e&&e.detail?' ['+e.detail+']':'')}
  busy=false;$('#cS').disabled=false;
}
$('#cS').onclick=()=>{const x=$('#cI').value.trim();if(x||att.length){$('#cI').value='';askAI(x||t('askErr'))}};$('#cT').onclick=()=>askAI('cTest');
